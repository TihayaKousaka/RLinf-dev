defaults:
  - model/rlt_stage1@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 4-7

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "rlt_stage1_libero10_task6"
    logger_backends: ["wandb"]

  max_epochs: -1
  max_steps: 5000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths:
    - dataset_path: "/mnt/public2/xiekaizhi/rlt-openpi-sim/data/libero_10_image_task_6"
      weight: 1.0

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 256
  seed: 0

  model:
    precision: null
    model_path: "/mnt/public2/xiekaizhi/rlt-openpi-sim/pi05_base"
    num_action_chunks: 10
    action_dim: 7
    rlt_stage1:
      alpha: 1.0
      config_name: "pi05_libero"
      num_images_in_input: 2
      num_steps: 5
      embedding_dim: 2048
      encoder_layers: 2
      encoder_heads: 8
      decoder_layers: 2
      decoder_heads: 8

  openpi_data:
    repo_id: "data/libero_10_task_6"

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 5000
    lr_warmup_steps: 500
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
