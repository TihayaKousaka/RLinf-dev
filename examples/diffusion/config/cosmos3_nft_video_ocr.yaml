defaults:
- env/ocr_video@env.train
- env/ocr_video@env.eval
- model/cosmos3_diffusion@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:DIFFUSION_PATH}/config/
  - file://${oc.env:REPO_PATH}/examples/embodiment/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: cosmos3_nft_video_ocr
    logger_backends:
    - tensorboard
  max_epochs: 70
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: false
  kl_penalty: kl
  kl_penalty_type: kl
  group_size: 4
  reward_coef: 1.0
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo_video
  advantage_mode: video
  loss_type: embodied_nft
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.0001
  clip_ratio_low: 0.0001
  clip_ratio_c: null
  gamma: 1.0
  gae_lambda: 1.0
  filter_rewards: false
  nft_loss_form: mse
  nft_beta: 0.1
  adv_clip_max: 5.0
  dpo_beta: 1.0
  nft_weight_mode: adaptive
  nft_weight_scale: 1.0
  nft_target_space: x0
  nft_xcur_source: resample
  nft_tau: 1.0
  nft_clip_ratio: 0.1
  recompute_v: false
  nft_gather_type: chunk_level
  nft_energy_reduction: mean
env:
  group_name: EnvGroup
  enable_offload: false
  train:
    total_num_envs: 32
    group_size: ${algorithm.group_size}
    max_episode_steps: 1
    max_steps_per_rollout_epoch: 2
    rollout_epoch: 1
    video_cfg:
      save_video: false
    dataset:
      type: visual.ocr_dataset
      path: /path/to/dataset/ocr
      split: train
    reward:
      type: single
      model: visual.video_ocr
      key: avg
      use_gpu: false
      lang: en
      frame_interval: 4
      reward_type: video_level
  eval:
    total_num_envs: 32
    group_size: 1
    max_episode_steps: 1
    max_steps_per_rollout_epoch: 2
    is_eval: true
    rollout_epoch: 1
    dataset:
      type: visual.ocr_dataset
      path: /path/to/dataset/ocr
      split: test
    reward:
      type: single
      model: visual.video_ocr
      key: avg
      use_gpu: false
      lang: en
      frame_interval: 4
      reward_type: video_level
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  collect_prev_infos: true
  collect_final_values: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 32
  seed: 42
  enable_offload: true
  model:
    model_path: /path/to/Cosmos3-Nano-DCP
    precision: bf16
  optim:
    lr: 0.0001
    value_lr: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0001
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp2
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    enable_gradient_accumulation: true
    reshard_after_forward: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
