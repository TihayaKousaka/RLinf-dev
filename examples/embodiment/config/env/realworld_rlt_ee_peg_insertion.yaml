env_type: realworld

total_num_envs: null

auto_reset: True
ignore_terminations: False
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 100
max_episode_steps: 100
no_gripper: False
use_spacemouse: False
use_gello: True
gello_port: "${oc.env:RLT_REALWORLD_GELLO_PORT,/dev/ttyUSB0}"
gello_action_mode: ee_delta
use_relative_frame: False
use_quat_tcp_pose: True
use_rlt_joint_obs: True
main_image_key: "${oc.env:RLT_REALWORLD_MAIN_IMAGE_KEY,main_camera}"
wrist_image_key: "${oc.env:RLT_REALWORLD_WRIST_IMAGE_KEY,wrist_camera}"
default_prompt: "insert the peg in the hole"
keyboard_reward_wrapper: null
task_mode: critical_phase
critical_phase_key: v
record_prefix_before_critical_phase: false

# Keep the current realworld RLT 34D state layout for SFT/Stage1/Stage2:
# state[0] gripper
# state[1:8] joint_pos
# state[8:15] joint_vel
# state[15:18] tcp_force
# state[18:25] tcp_pose
# state[25:28] tcp_torque
# state[28:34] tcp_vel
state_key_order:
  - gripper
  - joint_pos
  - joint_vel
  - tcp_force
  - tcp_pose
  - tcp_torque
  - tcp_vel

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  # Consumes 7D EE delta actions:
  # actions[0:3] normalized xyz delta, actions[3:6] normalized xyz-euler delta,
  # actions[6] gripper command.
  id: "${oc.env:RLT_REALWORLD_EE_ENV_ID,PegInsertionEnv-v1}"
  num_envs: null

override_cfg:
  is_dummy: false
  task_description: "insert the peg in the hole"
  # Replace placeholders with calibrated realworld task values before running hardware.
  target_ee_pose: TARGET_EE_POSE
  joint_reset_qpos: RESET_JOINT_QPOS
  reward_threshold: [0.015, 0.015, 0.03, 0.2, 0.2, 0.2]
  use_dense_reward: false
  reward_scale: 1.0
  enable_gripper_penalty: false
  max_num_steps: 100
